name: 24/7 Persistent Cloud Pinger

on:
  schedule:
    # Runs every 15 minutes 24x7 to guarantee Render never hibernates
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          echo "Sending 24/7 keep-alive ping to Render at $(date)..."
          curl -s -f -m 30 https://delta-btc-options-bot.onrender.com/ping || true
          echo "Keep-alive ping completed."
