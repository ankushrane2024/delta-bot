name: Keep Alive Pinger

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes to ensure Render never sleeps
  workflow_dispatch: # Allows manual trigger from GitHub UI if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Bot
        run: |
          curl -s https://delta-btc-options-bot.onrender.com/ping
          echo "Ping successful!"
