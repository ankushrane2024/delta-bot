<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Options Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(20, 25, 40, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-glow: rgba(0, 212, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(30, 58, 138, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 212, 255, 0.1), transparent 25%);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        header {
            max-width: 1100px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 {
            font-weight: 800;
            margin: 0;
            font-size: 2rem;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.1);
            transition: all 0.3s ease;
        }

        .status-badge.offline {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.1);
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 10px 0;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-start:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            transform: scale(1.02);
        }

        .btn-stop {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-stop:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
            transform: scale(1.02);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }

        .log-terminal {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 16px;
            height: 250px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #a7f3d0;
            border: 1px solid var(--border-color);
        }

        .log-line {
            margin-bottom: 6px;
            line-height: 1.4;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Delta Engine</h1>
            <div style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px;">Automated Short Strangle Strategy</div>
        </div>
        <div id="status-badge" class="status-badge">🟢 CONNECTING...</div>
    </header>

    <div class="container">
        <!-- Equity & Mode Panel -->
        <div class="panel">
            <h2>Account Overview</h2>
            <div class="stat-label">Current Equity (USDT)</div>
            <div id="equity-val" class="stat-value">$0.00</div>
            
            <div style="display: flex; gap: 20px; margin-top: 15px;">
                <div>
                    <div class="stat-label">Mode</div>
                    <div id="mode-val" style="font-weight: 600; color: #38bdf8; font-size: 1.1rem;">-</div>
                </div>
                <div>
                    <div class="stat-label">Daily Loss Hits</div>
                    <div id="loss-hits-val" style="font-weight: 600; color: var(--danger); font-size: 1.1rem;">0 / 2</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn-start" onclick="sendCommand('start')">▶ START BOT</button>
                <button class="btn-stop" onclick="sendCommand('stop')">⏹ STOP BOT</button>
            </div>
        </div>

        <!-- Active Positions Panel -->
        <div class="panel">
            <h2>Active Positions</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Side</th>
                            <th>Size</th>
                            <th>Entry</th>
                        </tr>
                    </thead>
                    <tbody id="positions-body">
                        <tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">No active positions</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Live Terminal Panel -->
        <div class="panel full-width">
            <h2>Live System Logs</h2>
            <div class="log-terminal" id="log-terminal">
                <div class="log-line">Initializing connection to engine...</div>
            </div>
        </div>
    </div>

    <script>
        // Command API
        async function sendCommand(action) {
            try {
                await fetch(`/api/${action}`, { method: 'POST' });
                fetchStatus();
            } catch (e) {
                console.error("Command failed", e);
            }
        }

        // Status Polling
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                // Update Badge
                const badge = document.getElementById('status-badge');
                if(data.is_running) {
                    badge.textContent = `🟢 ENGINE RUNNING`;
                    badge.className = 'status-badge';
                } else {
                    badge.textContent = `🔴 ENGINE STOPPED`;
                    badge.className = 'status-badge offline';
                }

                // Update Stats
                document.getElementById('equity-val').textContent = `$${data.equity.toLocaleString()}`;
                document.getElementById('mode-val').textContent = data.mode;
                document.getElementById('loss-hits-val').textContent = `${data.daily_loss_hits} / 2`;

                // Update Positions
                const tbody = document.getElementById('positions-body');
                if(data.positions && data.positions.length > 0) {
                    tbody.innerHTML = '';
                    data.positions.forEach(pos => {
                        tbody.innerHTML += `
                            <tr>
                                <td style="font-weight: 600;">${pos.symbol}</td>
                                <td style="color: ${pos.side === 'SELL' ? 'var(--danger)' : 'var(--success)'};">${pos.side}</td>
                                <td>${pos.size}</td>
                                <td>$${pos.entry_price}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">No active positions</td></tr>`;
                }

                // Update Logs
                const logTerm = document.getElementById('log-terminal');
                const isScrolledToBottom = logTerm.scrollHeight - logTerm.clientHeight <= logTerm.scrollTop + 10;
                
                logTerm.innerHTML = data.logs.map(line => {
                    let color = "#a7f3d0"; // default green-ish
                    if(line.includes("ERROR") || line.includes("CRITICAL")) color = "#fca5a5";
                    if(line.includes("WARNING")) color = "#fde047";
                    return `<div class="log-line" style="color: ${color};">${line}</div>`;
                }).join('');

                if (isScrolledToBottom) {
                    logTerm.scrollTop = logTerm.scrollHeight;
                }

            } catch (e) {
                console.error("Polling failed", e);
                const badge = document.getElementById('status-badge');
                badge.textContent = `🔴 OFFLINE`;
                badge.className = 'status-badge offline';
            }
        }

        // Poll every 2 seconds
        setInterval(fetchStatus, 2000);
        fetchStatus();
    </script>
</body>
</html>
