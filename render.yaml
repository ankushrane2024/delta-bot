services:
  - type: web
    name: delta-btc-options-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DELTA_API_KEY
        sync: false
      - key: DELTA_API_SECRET
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: ENABLE_ARES
        value: "false"
