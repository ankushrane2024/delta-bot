services:
  - type: web
    name: delta-btc-options-bot
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DELTA_API_KEY
        sync: false
      - key: DELTA_API_SECRET
        sync: false
      - key: BOT_MODE
        value: "PAPER"
      - key: ENABLE_TELEGRAM_HEARTBEAT
        value: "true"
      - key: HEARTBEAT_INTERVAL_MINS
        value: "60"
      - key: ENABLE_ARES
        value: "true"
